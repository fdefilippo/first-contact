; first-contact - configurazione
;
; Formato INI (nessuna dipendenza esterna).
; Dopo ogni modifica: systemctl restart first-contact-milter
; Verifica: first-contact doctor

[milter]
; Socket usato da Postfix.
;  - unix:/percorso  -> consigliato
;  - inet:11334@127.0.0.1 -> solo se il socket unix non e' praticabile
; Con smtpd in chroot il socket deve stare sotto /var/spool/postfix e in
; main.cf va indicato come unix:/first-contact/milter.sock (vedi postfix/).
socket = unix:/var/spool/postfix/first-contact/milter.sock

; Nome dell'header aggiunto. Presenza = allerta.
header_name = X-First-Contact

; top = subito visibile in cima agli header, end = in fondo.
; Con "top" serve il supporto insheader di Postfix; se manca, il milter
; ripiega automaticamente su "end".
header_position = top

; Timeout (secondi) che Postfix concede al milter. 0 = default libmilter.
timeout = 0

[policy]
; envelope = indirizzo della busta (MAIL FROM), robusto e non falsificabile
;            dal contenuto del messaggio (ma falsificabile in SMTP).
; from     = indirizzo dell'header From: (piu' "umano", ma puo' differire
;            dal mittente reale e venire alterato con facilita').
key_source = envelope

; address = ogni indirizzo e' un mittente distinto.
; domain  = allerta solo al primo messaggio da un dominio.
key_scope = address

; Messaggi inviati da utenti autenticati (SASL) e da reti interne:
; normalmente non interessano, sono posta "di casa".
process_authenticated = false
process_local = false
trusted_networks = 127.0.0.0/8, ::1

; Mittenti con questi domini vengono ignorati (posta interna/automatica).
skip_local_senders = example.it

; Rimbalzi e notifiche di sistema (MAIL FROM vuoto) non generano allerta.
skip_null_sender = true

; Tetto ai destinatari gestiti per singolo messaggio.
max_recipients = 50

; Regola "mittente assente": se un mittente che conosciamo non si fa vivo
; da almeno N giorni, il messaggio riceve un avviso dedicato che segnala
; l'assenza prolungata. 0 = regola disattivata.
; Richiede che last_seen venga aggiornato: il milter lo fa comunque quando
; questa soglia e' maggiore di zero, anche con track_stats = false.
dormant_days = 90

; true = registra i contatti ma NON aggiunge header (rodaggio: popola il
; database senza disturbare nessuno). Consigliato per la prima settimana.
observe_only = false

[banner]
; Avviso VISIBILE all'utente (non solo header tecnico).
;   off     = nessun avviso visibile, resta il solo header X-First-Contact
;   body    = banner in cima al corpo del messaggio (consigliato)
;   subject = prefisso nell'oggetto
;   both    = entrambi
mode = body

; Testo del banner. Segnaposto disponibili:
;   {sender}      mittente che scrive per la prima volta
;   {recipient}   primo destinatario
;   {recipients}  elenco dei destinatari nuovi
;   {first_seen}  data/ora del primo contatto (UTC)
;   {client}      indirizzo IP del client SMTP
; Le righe sono impaginate automaticamente a 78 colonne.
text = ATTENZIONE: e' il primo messaggio che ricevi da {sender}.
       Non e' detto che sia pericoloso, ma presta attenzione ad allegati e link:
       non aprire file e non cliccare collegamenti se non ti fidi del mittente.

; Testo dell'avviso quando il mittente ricompare dopo un'assenza
; ([policy] dormant_days). Oltre ai segnaposto sopra sono disponibili:
;   {days}        giorni di assenza
;   {last_seen}   data/ora dell'ultimo messaggio (UTC)
; Lo stile resta lo stesso: box giallo con bordo tratteggiato.
text_resumed = ATTENZIONE: {sender} non ti scriveva da {days} giorni.
               Verifica l'identita' del mittente prima di aprire allegati o link.

; Prefisso aggiunto all'oggetto (usato con mode = subject oppure both).
; Esempio: [PRIMO CONTATTO] (vuoto = nessun prefisso)
subject_tag =

; Oltre questa dimensione (byte) il corpo non viene riscritto: si torna al
; solo header. 0 = nessun limite. 20971520 = 20 MiB.
max_body_bytes = 20971520

; true = non toccare i messaggi multipart/signed e multipart/encrypted
; (riscriverli invaliderebbe la firma/cifratura in modo visibile).
skip_signed = true

; true = l'avviso e' un box HTML con sfondo giallo, testo nero e bordo
; tratteggiato nero; false = solo testo (cornice tratteggiata in ASCII).
; La parte HTML e' affiancata da una versione text/plain per i client che
; mostrano solo testo.
html_box = true

[whitelist]
; Mittenti e reti ESENTATI dall'avviso: per loro non viene aggiunto ne'
; header ne' banner e non viene scritto nulla nel database.
;
; Formati accettati (separati da virgola):
;   mario.rossi@example.com   indirizzo esatto
;   @example.com              dominio e sottodomini
;   *.example.com             come sopra
;   example.com               come sopra
;   203.0.113.9               singolo indirizzo IP del client
;   10.0.0.0/8                rete CIDR del client
senders = postmaster@example.it, @example.it
networks = 127.0.0.0/8, ::1

; File opzionale con una voce per riga (stessi formati, '#' per i commenti).
; Viene riletto automaticamente quando cambia: si aggiungono o tolgono voci
; senza riavviare il servizio. Le righe non valide sono ignorate con un
; avviso nei log; le voci errate qui sopra invece bloccano l'avvio.
file = /etc/first-contact/whitelist.txt

[store]
path = /var/lib/first-contact/contacts.db
track_stats = true
; Cancella i contatti non piu' visti da N giorni (0 = conserva sempre).
retention_days = 0

[logging]
level = INFO
syslog = true
syslog_facility = mail
; Il tag e' gia' nel formato dei messaggi; questo campo e' solo documentativo.
syslog_tag = first-contact
; Log aggiuntivo su file (vuoto = disattivato). Preferire syslog.
file =
