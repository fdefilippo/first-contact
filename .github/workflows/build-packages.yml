name: build-packages

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: deb (noarch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dipendenze di build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3

      - name: Costruisci il .deb
        run: ./scripts/build-deb.sh

      - name: Carica l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-contact-deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: rpm (EL${{ matrix.el }}, noarch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        el: ["8", "9", "10"]
    steps:
      - uses: actions/checkout@v4

      - name: Costruisci l'RPM in Rocky Linux ${{ matrix.el }}
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            quay.io/rockylinux/rockylinux:${{ matrix.el }} \
            bash -c 'if [ "${{ matrix.el }}" = "8" ]; then
                       dnf install -y rpm-build python3-rpm-macros
                     else
                       dnf install -y rpm-build python3-rpm-macros systemd-rpm-macros
                     fi
                     ./scripts/build-rpm.sh'

      - name: Carica l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: first-contact-rpm-el${{ matrix.el }}
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scarica i pacchetti
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Allega i pacchetti alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
